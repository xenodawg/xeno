
name: Build Relay iPhone IPA
on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Unsigned for re-signing, or signed with configured Apple secrets'
        required: true
        default: unsigned
        type: choice
        options: [unsigned, ad-hoc, app-store-connect]
  push:
    paths:
      - 'Relay-iPhone-source.zip'
      - 'relay/ios/**'
      - 'relay/Sources/Networking.swift'
      - 'relay/Sources/LiveAPI.swift'
      - '.github/workflows/relay-iphone.yml'
permissions:
  contents: read
concurrency:
  group: relay-iphone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-ipa:
    permissions:
      contents: write
    if: github.event_name != 'workflow_dispatch' || inputs.signing == 'unsigned'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Extract prepared iPhone project
        run: |
          unzip -q -o Relay-iPhone-source.zip
          python3 - <<'PYCODE'
          import base64,hashlib,io,zipfile
          data=base64.b64decode("")
          assert hashlib.sha256(data).hexdigest()=="cb0c2bc70263a0827bb42d55a9b405473b7bda29cd9d4791a97417c5e530800d"
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
            for name in archive.namelist():
              assert name.startswith('relay/') and '..' not in name.split('/')
            archive.extractall('.')
          PYCODE
      - name: Build real iPhone arm64 application and package IPA
        run: bash relay/ios/build-ipa.sh unsigned
      - name: Upload unsigned IPA for re-signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Relay-iPhone-unsigned
          path: relay/ios/build/Relay-iPhone-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Build and inspect iPhone simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project relay/ios/Relay.xcodeproj -scheme Relay -configuration Debug -sdk iphonesimulator -destination "id=$device" -derivedDataPath relay/ios/build/simulator CODE_SIGNING_ALLOWED=NO build > relay/ios/build/simulator-build.log 2>&1 || { tail -100 relay/ios/build/simulator-build.log; exit 1; }
          xcrun simctl install "$device" relay/ios/build/simulator/Build/Products/Debug-iphonesimulator/Relay.app
          xcrun simctl launch "$device" com.iblack.relay.ios
          sleep 3
          xcrun simctl io "$device" screenshot relay/ios/build/iPhone-light.png
          xcrun simctl ui "$device" appearance dark
          sleep 1
          xcrun simctl io "$device" screenshot relay/ios/build/iPhone-dark.png
      - name: Upload iPhone UI screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Relay-iPhone-UI
          path: relay/ios/build/iPhone-*.png
          if-no-files-found: error
      - name: Publish iPhone release for automatic update checks
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          plist=relay/ios/build/derived/Build/Products/Release-iphoneos/Relay.app/Info.plist
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")
          tag="iphone-$version-$build"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; keeping its published IPA. Increment the build number for new releases."
          else
            gh release create "$tag" relay/ios/build/Relay-iPhone-unsigned.ipa --target "$GITHUB_SHA" --title "Relay iPhone $version (build $build)" --notes "Unsigned iPhone IPA. Native redesigned interface, voice/video calls, files/photos, AI streaming and reset, and automatic update checks. Install over the existing app through Sideloadly using the same Apple ID and bundle ID. Requires iOS 17 or later."
          fi
  signed-ipa:
    if: github.event_name == 'workflow_dispatch' && inputs.signing != 'unsigned'
    runs-on: macos-15
    timeout-minutes: 40
    environment: ios-signing
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      SIGNING_MODE: ${{ inputs.signing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Extract prepared iPhone project
        run: |
          unzip -q -o Relay-iPhone-source.zip
          python3 - <<'PYCODE'
          import base64,hashlib,io,zipfile
          data=base64.b64decode("")
          assert hashlib.sha256(data).hexdigest()=="cb0c2bc70263a0827bb42d55a9b405473b7bda29cd9d4791a97417c5e530800d"
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
            for name in archive.namelist():
              assert name.startswith('relay/') and '..' not in name.split('/')
            archive.extractall('.')
          PYCODE
      - name: Configure temporary signing keychain
        shell: bash
        run: |
          set -euo pipefail
          python3 relay/ios/prepare-signing.py
          source "$RUNNER_TEMP/relay-signing.env"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/relay-distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/relay.mobileprovision" > "$RUNNER_TEMP/relay-profile.plist"
          python3 relay/ios/install-profile.py
      - name: Archive and export signed IPA
        run: bash relay/ios/build-ipa.sh "$SIGNING_MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Relay-iPhone-signed
          path: relay/ios/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/relay-signing.env" ]]; then
            source "$RUNNER_TEMP/relay-signing.env"
            security delete-keychain "$KEYCHAIN" || true
          fi
          python3 relay/ios/cleanup-signing.py
